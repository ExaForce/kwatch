apiVersion: v1
kind: Namespace
metadata:
  name: kwatch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kwatch
  namespace: kwatch
data:
  config.yaml: |
    maxRecentLogLines: <optional_number_of_lines>
    ignoreFailedGracefulShutdown: <optional_boolean>
    alert:
      slack:
        webhook: <webhook_url>
        # or use a bot token with optional label-based channel routing:
        # token: <xoxb_bot_token>
        # channel: "#alerts-default"
        # routes:
        #   - labels:
        #       app: "^payments-.*"
        #     channels:
        #       - "#payments-alerts"
      pagerduty:
        integrationKey: <integration_key>
      discord:
        webhook: <webhook_url>
      telegram:
          token: <token_key>
          chatId: <chat_id>
      email:
        form: <from_mail>
        to: <to_mail>
        password: <password>
        host: <host>
        port: <port_number>
      teams:
          # Teams Workflows webhook URL, or set the TEAMS_WEBHOOK env var
          webhook: <workflows_webhook_url>
      rocketchat:
          webhook: <webhook_url>
      mattermost:
          webhook: <webhook_url>
      opsgenie:
        apiKey: <api_key>
    namespaces:
      - <optional_namespace>
    reasons:
      - <optional_reason>
    ignoreContainerNames:
      - <optional_container_name>

